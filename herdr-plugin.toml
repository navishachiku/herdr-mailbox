id = "herdr-mailbox"
name = "Mailbox"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "A mailbox per receiving agent: messages, decision questions and discussion questions with receipts"
platforms = ["macos", "linux"]

[[startup]]
command = ["node", "src/ensure.mjs"]

# After a herdr restart the screen's pane is gone; the first focus on its receiver brings it back.
[[events]]
on = "pane.focused"
command = ["node", "src/on-focus.mjs"]

# The shortcut: open the mailbox screen, focus it when it is open, close it when pressed from inside it.
[[actions]]
id = "open"
title = "Open mailbox"
contexts = ["pane"]
command = ["node", "src/open.mjs"]

[[panes]]
id = "screen"
title = "Mailbox"
placement = "split"
command = ["node", "src/screen/main.mjs"]

[[panes]]
id = "settings"
title = "Mailbox settings"
placement = "popup"
width = 64
height = 9
command = ["node", "src/screen/settings.mjs"]

[[panes]]
id = "attachment"
title = "Attachment"
placement = "popup"
width = 100
height = 30
command = ["node", "src/screen/attachment.mjs"]
